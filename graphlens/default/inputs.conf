#
# GraphLens scripted inputs.
#
# Disabled by default - see RBAC_MODEL.md before enabling. This snapshots
# this Splunk instance's own access-control structure (roles, capabilities,
# which indexes each role can search, role inheritance, and - where SAML or
# LDAP is configured - which identity-provider groups map to which roles)
# and writes it into an index as graphlens_relationships-shaped events, so
# it can be explored in the Relationship Explorer like any other data.
#
# That data is itself sensitive (see SECURITY.md, "RBAC model collector").
# Review who can read the target index before enabling this - either keep
# it in graphlens_relationships (visible to anyone with access to that
# index, i.e. by default the same analysts who use the rest of GraphLens),
# or point it at a separate, more tightly access-controlled index by
# changing `index` below and creating that index with its own srchIndexesAllowed
# restriction on the relevant roles.
[script://./bin/graphlens_rbac_collector.py]
disabled = true
interval = 86400
index = graphlens_relationships
sourcetype = graphlens:relationship
passAuth = splunk-system-user
python.version = python3
python.required = 3.13,3.14
