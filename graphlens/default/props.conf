#
# Field extraction for the GraphLens observed-relationship sourcetype.
# This does not create an index; it only tells Splunk how to parse events
# once an administrator has created an index and pointed a data input at
# it (see scripts/indexes.conf.example and INSTALL.md).
#

[graphlens:relationship]
SHOULD_LINEMERGE = false
INDEXED_EXTRACTIONS = csv
KV_MODE = none
TIMESTAMP_FIELDS = last_seen
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
disabled = false

#
# Sourcetype for demo relationship events only (Configuration page's "Load
# demo data" button, index mode - see services/demoDataService.js,
# services/splTemplates.js's buildSeedRelationshipsIndexSpl). Deliberately
# distinct from graphlens:relationship above: `| collect`'s own output
# format relies on ordinary automatic key=value field extraction, which
# that stanza's KV_MODE=none disables (it relies on index-time
# INDEXED_EXTRACTIONS=csv instead, which does not apply to `collect`'s
# output - confirmed against a live instance). KV_MODE=auto is actually
# already Splunk's own global default; this stanza exists to pin that
# explicitly rather than depend on it never being changed instance-wide.
#
# Deliberately no TIMESTAMP_FIELDS (unlike graphlens:relationship above):
# the bundled sample data's first_seen/last_seen are fixed historical
# dates, so parsing _time from last_seen the way real data does would
# backdate every demo event outside the Relationship Explorer's default
# "Last 24 hours" window the moment it's loaded, defeating the point of a
# one-click demo. Leaving _time at its default (collection/ingestion time)
# keeps demo data visible immediately, regardless of when it's loaded.
#
[graphlens:relationship:demo]
KV_MODE = auto
disabled = false
