#
# GraphLens controlled search templates.
#
# Only searches with NO per-request dynamic value live here as named saved
# searches: graphlens_graph_statistics and graphlens_health. Every search
# that needs a per-request value (a node id, a search term, an evidence
# key...) is dispatched as an ad-hoc search instead, built from a fixed SPL
# template in src/.../shared/services/splTemplates.js using
# already-validated/escaped values - never raw user input. See
# splTemplates.js's own doc comment for why: an earlier version of this
# file tried to parameterise saved searches via `$token$` placeholders
# substituted through the `/dispatch` REST call's `args.<token>` fields,
# which does not work - confirmed against a live Splunk Enterprise 10.6.1 (build 1)
# instance, the dispatched job still contains the literal, unresolved
# `$token$` text and fails immediately. The six stanzas that relied on that
# (graphlens_initial_entity_search, graphlens_expand_node,
# graphlens_node_details, graphlens_edge_details, graphlens_evidence_search,
# graphlens_cluster_expand) were removed from here for that reason; their
# exact SPL shape now lives in splTemplates.js instead, which is the
# single source of truth for it. See CHANGELOG.md and DEVELOPMENT.md for
# the full story.
#
# Both searches below are disabled for scheduling (no cron) because they
# are on-demand, user-triggered searches only. Time bounding is done
# through dispatch.earliest_time/dispatch.latest_time (standard REST
# dispatch parameters, parsed by Splunk's own dispatch layer), which
# searchService.js always sends on every dispatch call.
#

[graphlens_graph_statistics]
description = Aggregate counts used for the graph-limit banner and health page (total distinct nodes/edges/types observed in range, not the full dataset). No dynamic tokens, so this remains a genuine named saved search.
search = `graphlens_relationship_index`\
| stats dc(edge_id) as edge_count dc(source_id) as source_node_count dc(target_id) as target_node_count dc(relationship_type) as relationship_type_count sum(event_count) as total_event_count
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 30
dispatch.ttl = 300
enableSched = 0
is_visible = false

[graphlens_health]
description = Application health metrics for the GraphLens health dashboard, sourced from the app's own KV Store audit log collection (graphlens_audit_log). No indexed data or internal Splunk logs are required. No dynamic tokens, so this remains a genuine named saved search.
search = | inputlookup graphlens_audit_log\
| where created_time > relative_time(now(), "-7d")\
| eval outcome=coalesce(outcome, "unknown")\
| chart count over action by outcome
dispatch.earliest_time = -24h
dispatch.latest_time = now
dispatch.max_time = 30
dispatch.ttl = 300
enableSched = 0
is_visible = false
