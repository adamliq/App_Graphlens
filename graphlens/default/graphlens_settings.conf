#
# GraphLens administrator configuration defaults.
#
# These are safe, environment-neutral defaults. Administrators change
# behaviour by creating local/graphlens_settings.conf (directly, or through
# the in-app Configuration page, which writes there via the standard
# Splunk properties/configs REST endpoint under the graphlens_manage_config
# capability). Never edit this default file for a specific deployment.
#

[limits]
max_visible_nodes = 1000
max_visible_edges = 2500
max_expansion_neighbours = 100
max_expansion_depth = 3
max_path_depth = 5
max_search_result_rows = 500
search_dispatch_max_time_seconds = 30

[search]
# Where observed-relationship data comes from. "index" (default) reads
# graphlens_relationships-shaped events from relationship_index, as
# documented in DATA_INGESTION.md. "lookup" instead reads
# relationship_lookup directly via `| inputlookup` - no index or
# time-series pipeline required, for relationship data that is better
# maintained as a lookup table (e.g. a CMDB export, a curated CSV) than
# indexed as events. "saved_search" instead runs relationship_saved_search
# via `| savedsearch` - for relationship data better expressed as an
# already-authored search (a join across several indexes, a transforming
# search, etc) than as a lookup. "dataset" instead reads
# relationship_dataset via `| from datamodel:"<name>"` - for relationship
# data maintained as a Splunk Table Dataset (Settings > Datasets > Create
# Table View; a Table Dataset is itself stored as a single-object data
# model, which is why this reads it the same way a hand-authored data
# model would be read). Setting relationship_source_type to
# "saved_search" or "dataset", and changing relationship_saved_search or
# relationship_dataset once it is, all require the
# graphlens_use_search_source capability (not granted to any example role
# by default - see SECURITY.md); GraphLens trusts that search's or
# dataset's own content exactly as it already trusts a configured lookup's
# content, and does not review what either actually does. Only one of the
# four is active at a time, set by relationship_source_type.
relationship_source_type = index
relationship_index = graphlens_relationships
relationship_lookup = graphlens_relationships_lookup
relationship_saved_search =
relationship_dataset =
evidence_default_index = *
default_earliest = -24h
default_latest = now

[features]
enable_export = true
enable_annotations = true
enable_saved_views = true
enable_clustering = true
enable_path_finder = true
enable_graph_query = true
enable_time_slicer = true
enable_style_overrides = true

[allowlist]
# Comma-separated. Empty means "governed entirely by the
# graphlens_node_types / graphlens_relationship_types KV Store collections".
allowed_node_types =
allowed_relationship_types =
allowed_layouts = cose,concentric,breadthfirst,circle,grid
allowed_export_formats = json,csv,png
