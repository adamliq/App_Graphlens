#
# GraphLens search macros.
#
# All macros are prefixed with graphlens_ to avoid collisions with other
# applications. Macros that accept identifiers perform allowlist validation
# with match() before the value is used anywhere else in the search. The
# browser client independently validates and escapes the same values before
# they are ever sent to Splunk (see src/.../utilities/splSafety.js); the
# macros are defence-in-depth, not the only control.
#

# Base index clause for observed (time-series) relationship events. Kept as
# a single macro so administrators can repoint the app at a differently
# named index without editing every saved search.
[graphlens_relationship_index]
definition = index=graphlens_relationships

# Base index clause for supporting/evidence events referenced by
# evidence_reference. Separate from the relationship summary index because
# evidence usually lives in the customer's own source indexes.
[graphlens_evidence_index_default]
definition = index=*

# Validates that a candidate entity/node identifier matches the safe,
# namespaced identifier grammar (e.g. user:jsmith, host:server01). This is
# a no-argument, plain text-substitution macro holding only the quoted
# regex pattern, applied with `match(<literal>, \`graphlens_id_pattern\`)`
# at each call site - e.g.
# `| where match("user:jsmith", \`graphlens_id_pattern\`)`.
#
# This went through two broken designs before landing here, both found by
# testing against a live Splunk Enterprise 10.6.1 (build 1) instance:
#   1. iseval=1 with the match() call as the macro body: rejected by the
#      search parser ("expected to be an eval expression that returns a
#      string").
#   2. A plain text-substitution macro taking the identifier itself as a
#      macro CALL ARGUMENT, e.g. `graphlens_valid_id(1)` with
#      `args=id`/`definition=match($id$, "...")`, invoked as
#      `` `graphlens_valid_id("user:jsmith")` ``: Splunk's macro-argument
#      parser does not respect the quoting boundary when the argument
#      contains a colon, which every GraphLens identifier does
#      ("user:jsmith") - the search fails with "Error in 'where' command:
#      The expression is malformed. Expected )." regardless of the regex
#      used. Reproduced with multiple regex variants, isolated down to the
#      colon in the call argument specifically.
# Keeping the identifier out of the macro's argument list entirely (as
# below) sidesteps that parser bug. See CHANGELOG.md.
[graphlens_id_pattern]
definition = "^[A-Za-z0-9][A-Za-z0-9:_\-\.@/]{0,254}$"

# Numeric limits (head counts, expansion sizes) are not macro-validated:
# clampInteger() in utilities/splSafety.js already returns a plain
# JavaScript number - never the original string - before it is ever
# interpolated into an SPL template in splTemplates.js, so there is no
# string-concatenation surface left for a macro to additionally guard.

# Common field projection used by every search that returns edges, so a new
# field cannot silently leak into the browser without being added here
# deliberately.
[graphlens_edge_fields]
definition = fields edge_id source_id source_type source_label target_id target_type target_label relationship_type relationship_label event_count first_seen last_seen risk_score source_index source_sourcetype evidence_reference

# Common field projection for node lookups.
[graphlens_node_fields]
definition = fields node_id node_type node_label node_group description risk_score first_seen last_seen event_count source_index source_sourcetype
